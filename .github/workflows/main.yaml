name: Main

on:
  pull_request:
  push:
    branches:
      - main

# Every job only reads the repo (checkout, then local commands); nothing here pushes or
# publishes, so PR-triggered runs get no write token or OIDC token.
permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yaml
  contract-check:
    uses: ./.github/workflows/contract-check.yaml
  api-sync-check:
    uses: ./.github/workflows/api-sync-check.yaml
  package:
    uses: ./.github/workflows/package.yaml
  type-checking:
    uses: ./.github/workflows/type-checking.yaml
    needs: [lint]
  tests:
    needs: [lint, type-checking]
    uses: ./.github/workflows/tests.yaml
  snyk:
    needs: [lint, tests]
    uses: ./.github/workflows/snyk.yaml
    secrets: inherit