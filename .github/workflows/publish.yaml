name: Publish

# Changesets release flow (https://changesets.dev/guide/automating):
#   - changesets pending on main -> open or update the "Version Packages" PR
#   - that PR merged (no changesets left, version not on npm yet) -> test, pack, then publish
#     with npm trusted publishing (OIDC), tag vX.Y.Z and create the GitHub release
#
# Keep this file's name and `name: Publish`: npm's trusted publisher for @blindpay/node is
# bound to publish.yaml, and pipeline-alert.yml pages Slack by workflow name.

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    name: Select release mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Open or update the Version Packages PR
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Version packages
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # The PAT, not GITHUB_TOKEN: a PR opened or pushed with GITHUB_TOKEN starts no
          # pull_request workflows, so the Version Packages PR would show no CI checks.
          github-token: ${{ secrets.SDK_SYNC_PAT || github.token }}
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
        env:
          # Read-only lookups by @changesets/changelog-github to link PRs and authors.
          GITHUB_TOKEN: ${{ github.token }}

  pack:
    name: Test and pack
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      # Main runs the same checks on this push in parallel and does not gate this workflow,
      # so the release re-checks the exact commit it is about to ship.
      - name: Type-check
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Pack
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    # The only job holding the npm OIDC token; it publishes the tarball pack built and runs
    # no project scripts of its own.
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # registry-url with no NODE_AUTH_TOKEN: a token in .npmrc takes precedence over the
      # OIDC exchange and fails with E404.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      - name: Check npm supports trusted publishing
        run: |
          NPM_VERSION="$(npm --version)"
          if ! node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            process.exit(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))) ? 0 : 1);
          ' "$NPM_VERSION"; then
            echo "::error::npm $NPM_VERSION is older than 11.5.1, the first version with trusted publishing."
            exit 1
          fi
          echo "npm $NPM_VERSION supports trusted publishing."

      - name: Publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
